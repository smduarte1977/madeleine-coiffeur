name: Atualizar dados do Instagram

on:
  schedule:
    - cron: '0 9,15,21 * * *'   # 6h, 12h e 18h no horário de Brasília
  workflow_dispatch: {}          # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/atualizar.py
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
      - name: Salvar os dados novos
        run: |
          git config user.name "atualizacao-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add data assets
          git diff --cached --quiet || git commit -m "Dados do Instagram atualizados"
          git push
